services:
  - type: web
    name: ppob-backend
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma db push
    startCommand: node index.js
    rootDir: server
    envVars:
      - key: JWT_SECRET
        sync: false  # Nanti Anda isi manual di dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: ppob-db
          property: connectionString

databases:
  - name: ppob-db
    plan: free
    region: singapore